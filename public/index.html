<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D81E05">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sunco CRM">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Sunco Motors Enquiry Management CRM</title>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/core.js" defer></script>
  <script src="/js/enquiries.js" defer></script>
  <script src="/js/trends.js" defer></script>
  <script src="/js/reports.js" defer></script>
  <script src="/js/admin.js" defer></script>
  <script src="/js/main.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/today">
      <img id="brand-logo" alt="" hidden>
      <span class="brand-mark" id="brand-mark" aria-hidden="true">S</span>
      <span id="dealer-name">Sunco Motors</span>
      <span class="product-name">Enquiry Management</span>
    </a>
    <div class="topbar-tools">
      <div class="topbar-right" id="topbar-right" hidden>
        <a class="topbar-new" href="#/new">+ New walk-in</a>
      </div>
      <button type="button" class="theme-btn" id="theme-btn"></button>
      <a class="user-chip" href="#/account" id="user-chip" hidden></a>
    </div>
  </header>
  <div class="shell">
    <nav class="sidenav" id="nav" aria-label="Main" hidden></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
</body>
</html>
