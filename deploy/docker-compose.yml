# Sunco Motors Enquiry Management CRM: app + Caddy (automatic HTTPS).
# See docs/hosting/ for the full guides.
#
#   1. Copy .env.example to .env and fill it in.
#   2. docker compose up -d --build
#   3. docker compose exec crm npm run create-user -- --admin --role general_manager --username jake --name "Jake Curran"
services:
  crm:
    build: ..
    image: sunco-crm
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      BACKUP_DIR: /backups
      TRUST_PROXY: "true"
    volumes:
      - crm-data:/data
      - ${BACKUP_PATH:-./backups}:/backups
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - crm
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  crm-data:
  caddy-data:
  caddy-config:
